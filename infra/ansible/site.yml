---
- name: Configurar y desplegar ReEstreno
  hosts: all
  become: true
  gather_facts: true
  vars:
    app_dir: /opt/reestreno
    app_domain: "{{ lookup('ansible.builtin.env', 'APP_DOMAIN') }}"
    app_tag: "{{ lookup('ansible.builtin.env', 'APP_TAG') }}"
    supabase_url: "{{ lookup('ansible.builtin.env', 'SUPABASE_URL') }}"
    supabase_anon_key: "{{ lookup('ansible.builtin.env', 'SUPABASE_ANON_KEY') }}"
    docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
  tasks:
    - name: Validar configuración de despliegue
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
          - app_tag | length > 0
          - supabase_url is match('^https://[^/]+$')
          - supabase_anon_key | length > 20
          - app_domain == '' or app_domain is match('^[a-zA-Z0-9][a-zA-Z0-9.-]+\\.[a-zA-Z]{2,}$')
        fail_msg: Faltan datos de despliegue o la VM no usa Ubuntu 24.04.
      no_log: true

    - name: Instalar herramientas base
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - iptables
          - python3-apt
        update_cache: true
        cache_valid_time: 3600
        state: present

    - name: Crear directorio de claves APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar clave oficial de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configurar repositorio oficial de Docker
      ansible.builtin.apt_repository:
        repo: 'deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
        filename: docker
        state: present

    - name: Instalar Docker Engine y Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Iniciar Docker al arrancar
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Instalar reglas de iptables persistentes
      ansible.builtin.copy:
        src: files/reestreno-firewall.sh
        dest: /usr/local/sbin/reestreno-firewall
        owner: root
        group: root
        mode: '0755'

    - name: Instalar servicio de firewall
      ansible.builtin.copy:
        src: files/reestreno-firewall.service
        dest: /etc/systemd/system/reestreno-firewall.service
        owner: root
        group: root
        mode: '0644'
      register: firewall_unit

    - name: Recargar systemd si cambió el servicio
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: firewall_unit.changed

    - name: Activar reglas de red al arrancar
      ansible.builtin.systemd_service:
        name: reestreno-firewall
        enabled: true
        state: started

    - name: Aplicar reglas ahora
      ansible.builtin.command: /usr/local/sbin/reestreno-firewall
      changed_when: false

    - name: Crear directorio de la aplicación
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Instalar Compose de producción
      ansible.builtin.copy:
        src: files/compose.yaml
        dest: '{{ app_dir }}/compose.yaml'
        owner: root
        group: root
        mode: '0644'

    - name: Configurar proxy y HTTPS
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: '{{ app_dir }}/Caddyfile'
        owner: root
        group: root
        mode: '0644'

    - name: Escribir configuración de la aplicación
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: '{{ app_dir }}/.env'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Descargar imágenes de Docker Hub
      ansible.builtin.command: docker compose pull
      args:
        chdir: '{{ app_dir }}'
      changed_when: true

    - name: Iniciar contenedores
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: '{{ app_dir }}'
      changed_when: true

    - name: Esperar puerto HTTP
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 120

    - name: Verificar respuesta HTTP local
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ app_domain if app_domain else 'localhost' }}"
        status_code: [200, 301, 308]
        follow_redirects: none
      register: web_response
      retries: 12
      delay: 5
      until: web_response.status in [200, 301, 308]

    - name: Comprobar túnel temporal de Cloudflare
      ansible.builtin.command: docker container inspect reestreno-quick-tunnel
      register: quick_tunnel_container
      failed_when: false
      changed_when: false
      when: app_domain == ''

    - name: Crear túnel temporal de Cloudflare
      ansible.builtin.command: >-
        docker run -d --name reestreno-quick-tunnel --restart unless-stopped
        --network host cloudflare/cloudflared:latest tunnel --no-autoupdate
        --url http://127.0.0.1:80
      when: app_domain == '' and quick_tunnel_container.rc != 0

    - name: Mantener activo el túnel existente
      ansible.builtin.command: docker start reestreno-quick-tunnel
      changed_when: false
      when: app_domain == '' and quick_tunnel_container.rc == 0

    - name: Obtener URL temporal de Cloudflare
      ansible.builtin.shell: >-
        docker logs reestreno-quick-tunnel 2>&1 |
        grep -oE 'https://[a-z0-9-]+[.]trycloudflare[.]com' | tail -n 1
      register: quick_tunnel_url
      changed_when: false
      retries: 20
      delay: 3
      until: quick_tunnel_url.stdout | length > 0
      when: app_domain == ''

    - name: Usar URL temporal en el backend
      ansible.builtin.lineinfile:
        path: '{{ app_dir }}/.env'
        regexp: '^WEB_URL='
        line: 'WEB_URL={{ quick_tunnel_url.stdout }}'
        mode: '0600'
      register: quick_tunnel_backend_url
      when: app_domain == ''

    - name: Aplicar URL temporal al backend
      ansible.builtin.command: docker compose up -d --no-deps backend
      args:
        chdir: '{{ app_dir }}'
      when: app_domain == '' and quick_tunnel_backend_url.changed

    - name: Mostrar URL temporal del sitio
      ansible.builtin.debug:
        msg: 'ReEstreno: {{ quick_tunnel_url.stdout }}'
      when: app_domain == ''
