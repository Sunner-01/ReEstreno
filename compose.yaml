name: reestreno
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      WEB_URL: ${WEB_URL:-http://localhost:4310}
      PORT: 4311
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: 10m
        max-file: '3'
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - '127.0.0.1:4310:4310'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
