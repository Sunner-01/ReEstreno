name: ReEstreno - publicar y desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reestreno-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests-dev.yml

  publish:
    name: Publicar imágenes en Docker Hub
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Validar datos de Docker Hub y Supabase
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$DOCKERHUB_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: sunner01
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            sunner01/reestreno-backend:${{ github.sha }}
            sunner01/reestreno-backend:latest
      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          tags: |
            sunner01/reestreno-frontend:${{ github.sha }}
            sunner01/reestreno-frontend:latest

  deploy:
    name: Crear OCI y configurar con Ansible
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /home/runner/.oci/api_key.pem
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      APP_TAG: ${{ github.sha }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Validar configuración de OCI
        env:
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
        run: |
          for name in OCI_API_KEY_PEM OCI_SSH_PRIVATE_KEY OCI_STATE_BUCKET OCI_NAMESPACE TF_VAR_tenancy_ocid TF_VAR_compartment_ocid TF_VAR_user_ocid TF_VAR_fingerprint TF_VAR_region TF_VAR_ssh_public_key; do
            test -n "${!name}" || { echo "Falta $name"; exit 1; }
          done
          if [[ -n "$APP_DOMAIN" ]]; then
            test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ZONE_ID" || { echo 'Faltan secretos de Cloudflare'; exit 1; }
          fi
      - name: Preparar claves sin subirlas al repositorio
        env:
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.oci" "$HOME/.ssh"
          printf '%s\n' "$OCI_API_KEY_PEM" > "$HOME/.oci/api_key.pem"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/reestreno"
          chmod 600 "$HOME/.oci/api_key.pem" "$HOME/.ssh/reestreno"
          ssh-keygen -y -f "$HOME/.ssh/reestreno" >/dev/null
      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Inicializar estado remoto OCI
        working-directory: infra/terraform
        env:
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="namespace=$OCI_NAMESPACE" \
            -backend-config="key=reestreno/terraform.tfstate" \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path" \
            -backend-config="region=$TF_VAR_region"
      - name: Validar y aplicar infraestructura
        working-directory: infra/terraform
        run: |
          terraform validate
          terraform apply -input=false -auto-approve
      - name: Obtener IP pública
        id: vm
        working-directory: infra/terraform
        run: echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Crear registro DNS inicial
        if: ${{ vars.APP_DOMAIN != '' }}
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: python scripts/cloudflare_dns.py prepare
      - name: Preparar Python y Ansible
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Ansible
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Esperar acceso SSH
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          for attempt in {1..30}; do
            echo "Esperando SSH: intento $attempt"
            if ssh-keyscan -T 5 -H "$PUBLIC_IP" > "$RUNNER_TEMP/hostkeys" 2>/dev/null && test -s "$RUNNER_TEMP/hostkeys"; then
              cat "$RUNNER_TEMP/hostkeys" >> "$HOME/.ssh/known_hosts"
              break
            fi
            sleep 10
          done
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i "$HOME/.ssh/reestreno" "ubuntu@$PUBLIC_IP" 'echo SSH_OK'
      - name: Instalar Docker y desplegar con Ansible
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          ansible-playbook -i "${PUBLIC_IP}," -u ubuntu \
            --private-key "$HOME/.ssh/reestreno" \
            infra/ansible/site.yml
      - name: Esperar certificado del dominio
        if: ${{ vars.APP_DOMAIN != '' }}
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          for attempt in {1..30}; do
            echo "Esperando HTTPS: intento $attempt"
            if curl -fsS --resolve "$APP_DOMAIN:443:$PUBLIC_IP" "https://$APP_DOMAIN/api/health"; then
              exit 0
            fi
            sleep 20
          done
          echo 'El certificado HTTPS no estuvo listo a tiempo'
          exit 1
      - name: Activar proxy Cloudflare y Full Strict
        if: ${{ vars.APP_DOMAIN != '' }}
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: python scripts/cloudflare_dns.py activate
      - name: Verificar sitio público
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          if [[ -n "$APP_DOMAIN" ]]; then
            curl -fsS --retry 6 --retry-delay 5 "https://$APP_DOMAIN/api/health"
            echo "Sitio: https://$APP_DOMAIN"
          else
            curl -fsS --retry 6 --retry-delay 5 "http://$PUBLIC_IP/api/health"
            echo "Sitio: http://$PUBLIC_IP"
          fi
